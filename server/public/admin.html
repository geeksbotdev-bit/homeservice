<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>uroojwithus · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="/brand/icon.png" />
<meta name="theme-color" content="#0B7C82" />
<style>
  /* ── Design tokens — mirrored from client/src/theme/theme.ts ─────────
     The admin panel uses the same system as the app and the website:
     deep teal + warm orange, Plus Jakarta Sans, 12/16/24 radii.        */
  :root {
    --primary-50:#E6F4F5; --primary-200:#B3DFE2; --primary-400:#1A9BA3;
    --teal:#0B7C82; --primary:#0B7C82; --primary-700:#065A5E; --primary-900:#03383B;
    --teal-50:#E6F4F5; --orange:#F39C12; --accent-50:#FEF3DC; --accent-600:#D68910;
    --ok:#059669; --ok-bg:#D1FAE5; --warn:#D97706; --warn-bg:#FEF3C7;
    --red:#DC2626; --red-bg:#FEF2F2; --violet:#7C3AED; --violet-bg:#EDE9FE;
    --ink:#111827; --muted:#374151; --faint:#9CA3AF; --text-3:#6B7280;
    --line:#E5E7EB; --bg:#F8FAFA; --surface:#F3F4F6; --card:#FFFFFF;
    --r-md:8px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
    --sh-soft:0 1px 4px rgba(0,0,0,.06);
    --sh-card:0 2px 12px rgba(0,0,0,.08);
    --sh-btn:0 5px 14px rgba(11,124,130,.30);
    --sidebar:248px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font-size:15px; line-height:1.55;
  }
  a { color:inherit; text-decoration:none; }
  img { display:block; max-width:100%; }
  button { cursor:pointer; border:none; font-family:inherit; }
  :focus-visible { outline:3px solid var(--primary-400); outline-offset:2px; border-radius:6px; }

  /* ── Login ───────────────────────────────────────────────────────── */
  #login {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
    background:
      radial-gradient(620px 360px at 85% -10%,rgba(11,124,130,.14),transparent 60%),
      radial-gradient(420px 320px at 5% 8%,rgba(243,156,18,.12),transparent 60%),
      linear-gradient(180deg,var(--bg),#fff 70%);
  }
  .login-card {
    background:#fff; border:1px solid var(--line); border-radius:var(--r-xl);
    padding:34px 30px; width:380px; max-width:100%; box-shadow:0 18px 44px rgba(3,56,59,.12);
  }
  .logo { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .logo img { height:34px; width:auto; }
  .logo .mark {
    width:38px; height:38px; border-radius:11px; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none;
  }
  .logo b { font-size:16px; letter-spacing:-.02em; }
  .logo span { color:var(--text-3); font-size:12.5px; }
  .login-card h2 { font-size:19px; letter-spacing:-.02em; margin-bottom:6px; }
  .login-card .hint { color:var(--text-3); font-size:13.5px; margin-bottom:18px; }
  label.fld { display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); margin-bottom:7px; }
  input, textarea, select {
    width:100%; border:1.5px solid var(--line); border-radius:var(--r-lg);
    padding:0 14px; height:48px; font-size:14.5px; font-family:inherit; color:var(--ink);
    background:#fff; outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea { height:auto; padding:12px 14px; line-height:1.6; }
  input:focus, textarea:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(11,124,130,.12); }
  input::placeholder, textarea::placeholder { color:var(--faint); }
  .btn {
    width:100%; height:50px; background:var(--teal); color:#fff; border-radius:var(--r-lg);
    font-weight:700; font-size:15px; margin-top:16px; box-shadow:var(--sh-btn);
    transition:background-color .15s ease, transform .15s ease;
  }
  .btn:hover { background:var(--primary-700); transform:translateY(-1px); }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; font-weight:600; }

  /* ── Shell ───────────────────────────────────────────────────────── */
  #app { display:none; min-height:100vh; }
  .sidebar {
    position:fixed; top:0; left:0; bottom:0; width:var(--sidebar); background:#fff;
    border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:3px;
    overflow-y:auto;
  }
  .nav-item {
    display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:var(--r-lg);
    color:var(--text-3); font-size:14.5px; font-weight:600; cursor:pointer;
    transition:background-color .15s ease, color .15s ease;
  }
  .nav-item:hover { background:var(--bg); color:var(--ink); }
  .nav-item.active { background:var(--primary-50); color:var(--teal); font-weight:700; }
  .nav-item .ic { width:20px; display:grid; place-items:center; flex:none; }
  .nav-item .ic svg { width:18px; height:18px; }
  .nav-sep { height:1px; background:var(--line); margin:14px 6px; }

  .main { margin-left:var(--sidebar); padding:26px clamp(18px,3vw,34px) 56px; }
  .topbar { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
  .topbar h1 { font-size:clamp(20px,2.4vw,26px); letter-spacing:-.03em; font-weight:800; }
  .topbar .sub { color:var(--text-3); font-size:13.5px; margin-top:3px; }
  .refresh {
    background:#fff; border:1.5px solid var(--line); color:var(--muted); border-radius:var(--r-lg);
    padding:0 16px; height:42px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:8px;
    transition:border-color .15s ease, color .15s ease;
  }
  .refresh:hover { border-color:var(--teal); color:var(--teal); }
  .refresh svg { width:15px; height:15px; }

  /* ── Stat cards ──────────────────────────────────────────────────── */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px; }
  .stat {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl); padding:18px 20px;
    box-shadow:var(--sh-soft); transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .stat:hover { transform:translateY(-2px); box-shadow:var(--sh-card); border-color:var(--primary-200); }
  .stat .label { color:var(--faint); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; }
  .stat .value { font-size:30px; font-weight:800; letter-spacing:-.035em; margin-top:8px; line-height:1.1; }
  .stat .value small { font-size:14px; color:var(--text-3); font-weight:600; letter-spacing:0; }
  .stat.accent .value { color:var(--teal); }

  /* ── Panels & tables ─────────────────────────────────────────────── */
  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-xl);
    overflow:hidden; box-shadow:var(--sh-soft);
  }
  .panel h3 { font-size:15px; font-weight:800; letter-spacing:-.01em; padding:16px 20px; border-bottom:1px solid var(--line); }
  .panel + .panel { margin-top:14px; }
  table { width:100%; border-collapse:collapse; }
  th {
    text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3);
    font-weight:700; padding:13px 20px; border-bottom:1px solid var(--line); background:var(--bg); white-space:nowrap;
  }
  td { padding:14px 20px; font-size:14px; border-bottom:1px solid var(--line); color:var(--muted); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tbody tr { transition:background-color .12s ease; }
  tbody tr:hover { background:var(--bg); }

  .tag { display:inline-flex; align-items:center; font-size:11px; font-weight:800; letter-spacing:.02em; padding:4px 10px; border-radius:var(--r-pill); text-transform:capitalize; }
  .t-green { background:var(--ok-bg); color:#065F46; }
  .t-teal { background:var(--primary-50); color:var(--primary-700); }
  .t-orange { background:var(--warn-bg); color:#92400E; }
  .t-gray { background:var(--surface); color:var(--text-3); }
  .t-red { background:var(--red-bg); color:#991B1B; }
  .t-violet { background:var(--violet-bg); color:#5B21B6; }

  .muted { color:var(--text-3); }
  .mono { font-variant-numeric:tabular-nums; font-weight:600; }
  .empty { padding:52px 20px; text-align:center; color:var(--faint); font-size:14.5px; }

  .search {
    height:42px; border:1.5px solid var(--line); border-radius:var(--r-lg); padding:0 14px;
    font-size:14px; width:min(280px,100%); background:#fff;
  }
  .rowline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .avatar {
    display:inline-flex; width:30px; height:30px; border-radius:50%; background:var(--primary-50); color:var(--teal);
    font-size:11px; font-weight:800; align-items:center; justify-content:center; margin-right:9px; vertical-align:middle; flex:none;
  }

  /* ── Buttons ─────────────────────────────────────────────────────── */
  .add {
    background:var(--teal); color:#fff; border-radius:var(--r-lg); padding:0 18px; height:42px;
    font-size:14px; font-weight:700; box-shadow:var(--sh-btn); transition:background-color .15s ease, transform .15s ease;
  }
  .add:hover { background:var(--primary-700); transform:translateY(-1px); }
  .ghost {
    background:#fff; border:1.5px solid var(--line); color:var(--muted); border-radius:var(--r-lg);
    padding:0 16px; height:42px; font-size:13.5px; font-weight:700; transition:border-color .15s ease, color .15s ease;
  }
  .ghost:hover { border-color:var(--teal); color:var(--teal); }
  .del {
    background:var(--red-bg); color:var(--red); border-radius:var(--r-md); padding:6px 12px;
    font-size:12.5px; font-weight:700; transition:background-color .15s ease;
  }
  .del:hover { background:#FBD5D5; }

  /* ── Modals ──────────────────────────────────────────────────────── */
  .modal { display:none; position:fixed; inset:0; background:rgba(3,56,59,.45); align-items:center; justify-content:center; z-index:60; padding:20px; backdrop-filter:blur(3px); }
  .modal-card {
    background:#fff; border-radius:var(--r-xl); width:500px; max-width:100%; max-height:90vh; overflow:auto;
    box-shadow:0 24px 64px rgba(0,0,0,.26); animation:pop .18s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98) } to { opacity:1; transform:none } }
  @media (prefers-reduced-motion:reduce){ .modal-card { animation:none } .stat:hover,.add:hover,.btn:hover { transform:none } }
  .modal-head { display:flex; align-items:center; justify-content:space-between; padding:17px 22px; border-bottom:1px solid var(--line); font-size:16px; font-weight:800; }
  .modal-body { padding:20px 22px; }
  .modal-body label { display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); margin:14px 0 7px; }
  .modal-body label:first-child { margin-top:0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--line); background:var(--bg); }

  /* ── Mobile: the sidebar becomes a scrollable tab strip ──────────── */
  @media (max-width:860px) {
    .sidebar {
      position:sticky; top:0; left:auto; bottom:auto; width:100%; height:auto; z-index:20;
      flex-direction:row; gap:6px; overflow-x:auto; overflow-y:hidden; padding:10px 12px;
      border-right:0; border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch;
    }
    .sidebar::-webkit-scrollbar { display:none; }
    .sidebar .logo, .nav-sep { display:none; }
    .nav-item { white-space:nowrap; padding:9px 14px; font-size:13.5px; }
    .main { margin-left:0; padding:18px 16px 48px; }
    .topbar { margin-bottom:18px; }
    th, td { padding-left:14px; padding-right:14px; }
    .grid2 { grid-template-columns:1fr; }
    /* Tables scroll sideways instead of squashing or breaking the page */
    .panel { overflow-x:auto; }
    table { min-width:620px; }
  }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-card">
    <div class="logo"><img src="/brand/logo-wordmark.png" alt="uroojwithus" /></div>
    <h2>Admin portal</h2>
    <p class="hint">Sign in to manage bookings, cleaners and payments.</p>
    <label class="fld" for="pass">Passcode</label>
    <input id="pass" type="password" placeholder="Admin passcode" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn" onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <aside class="sidebar">
    <div class="logo" style="margin-bottom:18px;padding:4px 6px 0"><img src="/brand/logo-wordmark.png" alt="uroojwithus" /></div>
    <div class="nav-item active" data-tab="overview" onclick="go('overview')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/></svg></span> Overview</div>
    <div class="nav-item" data-tab="bookings" onclick="go('bookings')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></span> Bookings</div>
    <div class="nav-item" data-tab="cleaners" onclick="go('cleaners')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span> Cleaners</div>
    <div class="nav-item" data-tab="verifications" onclick="go('verifications')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span> Verifications <span id="verifBadge" class="tag t-orange" style="display:none;margin-left:auto"></span></div>
    <div class="nav-item" data-tab="customers" onclick="go('customers')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9.5" cy="7" r="3.5"/><path d="M22 20v-2a4 4 0 00-3-3.9"/></svg></span> Customers</div>
    <div class="nav-item" data-tab="services" onclick="go('services')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M6 12V6a3 3 0 016 0"/><path d="M8 16v3M12 16v2M16 16v3"/></svg></span> Services</div>
    <div class="nav-item" data-tab="payments" onclick="go('payments')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/><path d="M6 15h4"/></svg></span> Payments</div>
    <div class="nav-sep"></div>
    <div class="nav-item" style="color:var(--red)" onclick="logout()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></span> Sign out</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1 id="title">Overview</h1><div class="sub" id="subtitle">All platform data, live</div></div>
      <button class="refresh" onclick="load()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg> Refresh</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Create service modal -->
<div id="modal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>New service</b><span onclick="closeModal()" style="cursor:pointer;color:var(--faint);font-size:20px">×</span></div>
    <div class="modal-body">
      <label>Name *</label><input id="f_name" placeholder="e.g. Sofa Cleaning" />
      <div class="grid2">
        <div><label>Category</label><input id="f_cat" placeholder="e.g. Deep Clean" /></div>
        <div><label>Base price (PKR)</label><input id="f_price" type="number" placeholder="2500" /></div>
      </div>
      <div class="grid2">
        <div><label>Unit noun</label><input id="f_unit" placeholder="room / sofa / service" /></div>
        <div><label>Duration</label><input id="f_dur" placeholder="1-2 hrs" /></div>
      </div>
      <label>Tagline</label><input id="f_tag" placeholder="Short one-liner" />
      <label>Description</label><textarea id="f_desc" rows="2" placeholder="What this service includes"></textarea>
      <label>What's included (one per line)</label><textarea id="f_incl" rows="3" placeholder="Deep scrub&#10;Sanitisation&#10;Supplies included"></textarea>
      <div class="err" id="svcErr"></div>
    </div>
    <div class="modal-foot"><button class="ghost" onclick="closeModal()">Cancel</button><button class="add" onclick="saveService()">Create service</button></div>
  </div>
</div>

<!-- Assign cleaner modal -->
<div id="assignModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>Assign a cleaner</b><span onclick="closeAssign()" style="cursor:pointer;color:var(--faint);font-size:20px">×</span></div>
    <div class="modal-body" style="max-height:60vh;overflow:auto"><div id="assignList"></div></div>
  </div>
</div>

<!-- Job photos modal (before / after evidence captured by the cleaner) -->
<div id="photoModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>Job photos</b><span onclick="closePhotos()" style="cursor:pointer;color:var(--faint);font-size:20px">×</span></div>
    <div class="modal-body" style="max-height:70vh;overflow:auto"><div id="photoBody"></div></div>
  </div>
</div>

<!-- New cleaner modal -->
<div id="clnModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><b>New cleaner</b><span onclick="closeCleanerModal()" style="cursor:pointer;color:var(--faint);font-size:20px">×</span></div>
    <div class="modal-body">
      <label>Name *</label><input id="c_name" placeholder="e.g. Imran Malik" />
      <div class="grid2">
        <div><label>Distance (km)</label><input id="c_dist" type="number" placeholder="2" /></div>
        <div></div>
      </div>
      <label>Bio</label><textarea id="c_bio" rows="2" placeholder="Specialist in deep cleaning…"></textarea>
      <div class="err" id="clnErr"></div>
    </div>
    <div class="modal-foot"><button class="ghost" onclick="closeCleanerModal()">Cancel</button><button class="add" onclick="saveCleaner()">Create cleaner</button></div>
  </div>
</div>

<script>
  const API = location.origin;
  let KEY = localStorage.getItem('hs_admin_key') || '';
  let TAB = 'overview';
  const fmtPKR = (n) => 'PKR ' + (n||0).toLocaleString('en-PK');
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-PK',{day:'numeric',month:'short'}) : '—';
  const esc = (s) => String(s??'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const initials = (n) => (n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();

  const STATUS_TAG = {
    confirmed:'t-teal', on_the_way:'t-orange', arrived:'t-violet', in_progress:'t-orange',
    completed:'t-green', cancelled:'t-red', pending:'t-gray',
  };
  const statusTag = (s) => `<span class="tag ${STATUS_TAG[s]||'t-gray'}">${esc((s||'').replace(/_/g,' '))}</span>`;

  async function api(pathname) {
    const r = await fetch(API + pathname, { headers: { 'x-admin-key': KEY } });
    if (r.status === 401) { logout(); throw new Error('unauthorized'); }
    return r.json();
  }

  async function doLogin() {
    const pass = document.getElementById('pass').value.trim();
    const err = document.getElementById('loginErr');
    err.textContent = '';
    try {
      const r = await fetch(API + '/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) });
      if (!r.ok) { err.textContent = 'Wrong passcode. Try again.'; return; }
      KEY = pass; localStorage.setItem('hs_admin_key', KEY);
      showApp();
    } catch { err.textContent = 'Could not reach the server.'; }
  }
  function logout() { KEY=''; localStorage.removeItem('hs_admin_key'); document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; }
  function showApp() { document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; load(); refreshVerifBadge(); }

  function go(tab) {
    TAB = tab;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab===tab));
    const titles = { overview:['Overview','All platform data, live'], bookings:['Bookings','Every booking across the platform'], cleaners:['Cleaners','Registered professionals'], verifications:['Verifications','Identity documents & approvals'], customers:['Customers','Registered customers'], services:['Services','Service catalogue & pricing'], payments:['Payments','Transactions & revenue'] };
    document.getElementById('title').textContent = titles[tab][0];
    document.getElementById('subtitle').textContent = titles[tab][1];
    load();
  }

  const C = () => document.getElementById('content');
  const loading = () => C().innerHTML = '<div class="empty">Loading…</div>';
  const table = (cols, rows) => rows.length ? `<div class="panel"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : '<div class="panel"><div class="empty">Nothing here yet.</div></div>';

  async function load() {
    loading();
    try {
      if (TAB==='overview') return renderOverview(await api('/admin/overview'));
      if (TAB==='bookings') return renderBookings(await api('/admin/bookings'));
      if (TAB==='cleaners') return renderCleaners(await api('/admin/cleaners'));
      if (TAB==='verifications') return renderVerifications(await api('/admin/verifications?status=all'));
      if (TAB==='customers') return renderCustomers(await api('/admin/customers'));
      if (TAB==='services') return renderServices(await api('/admin/services'));
      if (TAB==='payments') return renderPayments(await api('/admin/payments'));
    } catch(e) { if(e.message!=='unauthorized') C().innerHTML='<div class="empty">Failed to load.</div>'; }
  }

  function renderOverview(d) {
    const stat = (label,val,accent) => `<div class="stat ${accent?'accent':''}"><div class="label">${label}</div><div class="value">${val}</div></div>`;
    const stats = `<div class="stats">
      ${stat('Revenue', fmtPKR(d.revenue), true)}
      ${stat('Bookings', d.bookings)}
      ${stat('Active now', d.active)}
      ${stat('Completed', d.completed)}
      ${stat('Customers', d.customers)}
      ${stat('Cleaners', d.cleaners)}
      ${stat('Services', d.services)}
    </div>`;
    const rows = (d.recent||[]).map(b => `<tr>
      <td class="mono">${esc(b.id.slice(-6))}</td>
      <td>${esc(b.service)}</td>
      <td>${b.cleaner?`<span class="avatar">${initials(b.cleaner.name)}</span>${esc(b.cleaner.name)}`:'<span class="muted">Unassigned</span>'}</td>
      <td>${statusTag(b.status)}</td>
      <td class="mono">${fmtPKR(b.total)}</td>
      <td class="muted">${fmtDate(b.createdAt)}</td>
    </tr>`);
    C().innerHTML = stats + '<div class="rowline"><h3 style="font-size:15px">Recent bookings</h3></div>' + table(['ID','Service','Cleaner','Status','Amount','Date'], rows);
  }

  let _rows = [], _cols = [], _render = null;
  function withSearch(placeholder, cols, rows, renderRow) {
    _rows = rows; _cols = cols; _render = renderRow;
    C().innerHTML = `<div class="rowline"><input class="search" placeholder="${placeholder}" oninput="filter(this.value)"><span class="muted" id="count">${rows.length} total</span></div><div id="tbl"></div>`;
    paint(rows);
  }
  function paint(rows){ document.getElementById('tbl').innerHTML = table(_cols, rows.map(_render)); document.getElementById('count').textContent = rows.length+' shown'; }
  function filter(q){ q=q.toLowerCase().trim(); paint(!q?_rows:_rows.filter(r=>JSON.stringify(r).toLowerCase().includes(q))); }

  function renderBookings(list) {
    withSearch('Search bookings…', ['ID','Customer','Service','Cleaner','Type','Status','Amount','Photos','Date',''], list, b => `<tr>
      <td class="mono">${esc(b.id.slice(-6))}</td>
      <td>${esc(b.customer)}</td>
      <td>${esc(b.service)}</td>
      <td>${b.cleaner?esc(b.cleaner.name):'<span class="muted">—</span>'}</td>
      <td><span class="tag ${b.scheduledType==='later'?'t-gray':'t-teal'}">${b.scheduledType==='later'?'Scheduled':'Instant'}</span></td>
      <td>${statusTag(b.status)}</td>
      <td class="mono">${fmtPKR(b.total)}</td>
      <td>${photoCell(b)}</td>
      <td class="muted">${fmtDate(b.createdAt)}</td>
      <td style="white-space:nowrap">${['completed','cancelled'].includes(b.status)?'':`<button class="ghost" style="padding:5px 10px;font-size:12px" onclick="openAssign('${esc(b.id)}')">${b.cleaner?'Reassign':'Assign'}</button> <button class="del" onclick="cancelBooking('${esc(b.id)}')">Cancel</button>`}</td></tr>`);
  }
  // Before/after evidence the cleaner captured on site.
  function photoCell(b){
    const n = (b.beforePhotos||[]).length + (b.afterPhotos||[]).length;
    return n ? `<button class="ghost" style="padding:5px 10px;font-size:12px" onclick="openPhotos('${esc(b.id)}')">View ${n}</button>`
             : '<span class="muted">—</span>';
  }
  function openPhotos(id){
    const b = (_rows||[]).find(r=>r.id===id); if(!b) return;
    const strip = (label, list) => `<div style="margin-bottom:14px">
        <div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px">${label} (${list.length})</div>
        ${list.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap">${list.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" style="width:140px;height:110px;object-fit:cover;border-radius:9px;border:1px solid var(--line)" /></a>`).join('')}</div>`
                       : '<span class="muted" style="font-size:12px">None</span>'}
      </div>`;
    document.getElementById('photoBody').innerHTML =
      `<div class="muted" style="font-size:12px;margin-bottom:12px">${esc(b.service)} · ${esc(b.customer||'—')} · ${b.cleaner?esc(b.cleaner.name):'unassigned'}</div>`
      + strip('Before — site on arrival', b.beforePhotos||[])
      + strip('After — finished work', b.afterPhotos||[]);
    document.getElementById('photoModal').style.display='flex';
  }
  function closePhotos(){ document.getElementById('photoModal').style.display='none'; }

  function renderCleaners(list) {
    const rows = list.map(c => `<tr>
      <td><span class="avatar">${esc(c.initials)}</span>${esc(c.name)}</td>
      <td class="mono">${c.rating? '★ '+c.rating : '<span class="muted">New</span>'}</td>
      <td class="mono">${c.completed}</td>
      <td class="mono">${c.distanceKm} km</td>
      <td><span class="tag ${c.available?'t-green':'t-gray'}">${c.available?'Online':'Offline'}</span></td>
      <td>${verifTag(c.verifStatus)}</td>
      <td><span class="tag ${c.userLinked?'t-teal':'t-gray'}">${c.userLinked?'Real pro':'Demo'}</span></td>
      <td style="white-space:nowrap"><button class="ghost" style="padding:5px 10px;font-size:12px" onclick="toggleCleaner('${esc(c.id)}')">${c.available?'Set offline':'Set online'}</button> <button class="del" onclick="delCleaner('${esc(c.id)}','${esc(c.name)}')">Remove</button></td></tr>`);
    C().innerHTML = `<div class="rowline"><span class="muted">${list.length} cleaners</span><button class="add" onclick="openCleanerModal()">+ New cleaner</button></div>` + table(['Cleaner','Rating','Jobs done','Distance','Status','Verified','Type',''], rows);
  }
  const VERIF_TAG = { verified:'t-green', pending:'t-orange', rejected:'t-red', unverified:'t-gray' };
  function verifTag(s){ return `<span class="tag ${VERIF_TAG[s]||'t-gray'}">${esc(s||'unverified')}</span>`; }

  function renderVerifications(list) {
    const thumb = (url, label) => url
      ? `<a href="${esc(url)}" target="_blank" style="display:block"><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:5px">${label}</div><img src="${esc(url)}" style="width:130px;height:88px;object-fit:cover;border-radius:9px;border:1px solid var(--line)" /></a>`
      : `<div><div style="font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:5px">${label}</div><div style="width:130px;height:88px;border-radius:9px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px">None</div></div>`;
    const cards = list.map(c => `<div class="panel" style="padding:16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span class="avatar">${esc(c.initials)}</span>
        <div style="flex:1"><b>${esc(c.name)}</b> ${verifTag(c.verifStatus)}<br>
          <span class="muted" style="font-size:12px">${esc(c.phone||'—')} · CNIC ${esc(c.cnic||'—')}${c.verifAt?(' · '+fmtDate(c.verifAt)):''}</span>
          ${c.verifNote?`<br><span style="color:var(--red);font-size:12px">Note: ${esc(c.verifNote)}</span>`:''}
        </div>
        <div style="white-space:nowrap">
          ${c.verifStatus==='verified'?'':`<button class="add" style="background:var(--ok)" onclick="verifyCleaner('${esc(c.id)}','verified')">Approve</button>`}
          ${c.verifStatus==='rejected'?'':`<button class="del" style="padding:9px 14px" onclick="verifyCleaner('${esc(c.id)}','rejected')">Reject</button>`}
        </div>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap">${thumb(c.idFront,'CNIC Front')}${thumb(c.idBack,'CNIC Back')}${thumb(c.selfie,'Selfie')}</div>
    </div>`);
    const pending = list.filter(c=>c.verifStatus==='pending').length;
    C().innerHTML = `<div class="rowline"><span class="muted">${list.length} cleaners · ${pending} pending review</span></div>` + (cards.length?cards.join(''):'<div class="panel"><div class="empty">No cleaner accounts yet.</div></div>');
    setVerifBadge(pending);
  }
  async function verifyCleaner(id, status){
    let note = null;
    if (status==='rejected'){ note = prompt('Reason for rejection (shown to the cleaner):','Documents are unclear. Please re-upload.'); if(note===null) return; }
    else if (!confirm('Approve this cleaner? They will be able to accept jobs.')) return;
    const r = await fetch(API+'/admin/cleaners/'+id+'/verify',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify({status,note})});
    if(!r.ok){ alert('Could not update verification.'); return; }
    load(); refreshVerifBadge();
  }
  function setVerifBadge(n){ const b=document.getElementById('verifBadge'); if(!b)return; if(n>0){ b.style.display='inline-block'; b.textContent=n; } else b.style.display='none'; }
  async function refreshVerifBadge(){ try{ const l=await api('/admin/verifications?status=pending'); setVerifBadge(l.length); }catch{} }

  async function cancelBooking(id){ if(!confirm('Cancel this booking? The customer will be notified.'))return; const r=await fetch(API+'/admin/bookings/'+id+'/cancel',{method:'POST',headers:{'x-admin-key':KEY}}); if(!r.ok){alert('Could not cancel.');return;} load(); }
  async function toggleCleaner(id){ const r=await fetch(API+'/admin/cleaners/'+id+'/toggle',{method:'POST',headers:{'x-admin-key':KEY}}); if(!r.ok){alert('Could not update.');return;} load(); }
  async function delCleaner(id,name){ if(!confirm('Remove cleaner "'+name+'"? Their bookings will be unassigned.'))return; const r=await fetch(API+'/admin/cleaners/'+id,{method:'DELETE',headers:{'x-admin-key':KEY}}); if(!r.ok){alert('Could not remove.');return;} load(); }

  // Assign a cleaner to a booking
  let _assignBooking=null;
  async function openAssign(id){ _assignBooking=id; document.getElementById('assignModal').style.display='flex'; document.getElementById('assignList').innerHTML='<div class="muted" style="padding:12px">Loading cleaners…</div>'; try{ const list=await api('/admin/cleaners'); document.getElementById('assignList').innerHTML = list.length? list.map(c=>`<div class="pickrow" onclick="assignTo('${esc(c.id)}')"><span class="avatar">${esc(c.initials)}</span><div style="flex:1"><b>${esc(c.name)}</b><br><span class="muted" style="font-size:12px">${c.available?'online':'offline'} · ${c.distanceKm}km · ${c.rating?('★'+c.rating):'new'} · ${c.userLinked?'real pro':'demo'}</span></div></div>`).join('') : '<div class="muted" style="padding:12px">No cleaners. Add one in the Cleaners tab.</div>'; }catch{ document.getElementById('assignList').innerHTML='<div class="muted" style="padding:12px">Failed to load.</div>'; } }
  function closeAssign(){ document.getElementById('assignModal').style.display='none'; }
  async function assignTo(cid){ const r=await fetch(API+'/admin/bookings/'+_assignBooking+'/assign',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify({cleanerId:cid})}); if(!r.ok){alert('Could not assign.');return;} closeAssign(); load(); }

  // Create a cleaner (resource)
  function openCleanerModal(){ document.getElementById('clnModal').style.display='flex'; document.getElementById('clnErr').textContent=''; }
  function closeCleanerModal(){ document.getElementById('clnModal').style.display='none'; }
  async function saveCleaner(){ const g=id=>document.getElementById(id).value.trim(); const body={name:g('c_name'),distanceKm:Number(g('c_dist'))||1,bio:g('c_bio')}; const err=document.getElementById('clnErr'); if(!body.name){err.textContent='Cleaner name is required.';return;} try{ const r=await fetch(API+'/admin/cleaners',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify(body)}); if(!r.ok){const j=await r.json().catch(()=>({}));err.textContent=j.error||'Could not create.';return;} closeCleanerModal(); load(); }catch{ err.textContent='Network error.'; } }
  function renderCustomers(list) {
    withSearch('Search customers…', ['Customer','Phone','Email','Location','Bookings','Joined'], list, u => `<tr>
      <td><span class="avatar">${initials(u.name)}</span>${esc(u.name)}</td>
      <td class="mono">${esc(u.phone)}</td>
      <td class="muted">${esc(u.email)}</td>
      <td>${esc(u.location)}</td>
      <td class="mono">${u.bookings}</td>
      <td class="muted">${fmtDate(u.joined)}</td></tr>`);
  }
  function renderServices(list) {
    const rows = list.map(s => `<tr>
      <td><b>${esc(s.name)}</b><br><span class="muted" style="font-size:12px">${esc(s.tagline||'')}</span></td>
      <td><span class="tag t-teal">${esc(s.category)}</span></td>
      <td class="mono">${fmtPKR(s.basePrice)}</td>
      <td class="muted">${esc(s.unitNoun||'')}</td>
      <td class="mono">★ ${s.rating} (${s.reviews})</td>
      <td class="mono">${(s.addOns||[]).length}</td>
      <td><button class="del" onclick="delService('${esc(s.id)}','${esc(s.name)}')">Delete</button></td></tr>`);
    C().innerHTML = `<div class="rowline">
        <span class="muted">${list.length} services</span>
        <button class="add" onclick="openServiceModal()">+ New service</button>
      </div>` + table(['Service','Category','Base price','Unit','Rating','Add-ons',''], rows);
  }

  function openServiceModal() { document.getElementById('modal').style.display='flex'; document.getElementById('svcErr').textContent=''; }
  function closeModal() { document.getElementById('modal').style.display='none'; }
  async function saveService() {
    const g = (id) => document.getElementById(id).value.trim();
    const body = {
      name: g('f_name'), category: g('f_cat'), basePrice: Number(g('f_price'))||0,
      unitNoun: g('f_unit')||'service', duration: g('f_dur'), tagline: g('f_tag'),
      description: g('f_desc'), included: g('f_incl'),
    };
    const err = document.getElementById('svcErr');
    if (!body.name) { err.textContent='Service name is required.'; return; }
    try {
      const r = await fetch(API+'/admin/services', { method:'POST', headers:{'Content-Type':'application/json','x-admin-key':KEY}, body: JSON.stringify(body) });
      if (!r.ok) { const j=await r.json().catch(()=>({})); err.textContent = j.error || 'Could not create service.'; return; }
      closeModal(); load();
    } catch { err.textContent='Network error.'; }
  }
  async function delService(id, name) {
    if (!confirm('Delete service "'+name+'"? This cannot be undone.')) return;
    const r = await fetch(API+'/admin/services/'+id, { method:'DELETE', headers:{'x-admin-key':KEY} });
    if (!r.ok) { const j=await r.json().catch(()=>({})); alert(j.error||'Could not delete.'); return; }
    load();
  }
  function renderPayments(list) {
    withSearch('Search payments…', ['Txn','Customer','Service','Method','Amount','Status','Date'], list, p => `<tr>
      <td class="mono">${esc(p.txnId)}</td>
      <td>${esc(p.customer)}</td>
      <td>${esc(p.service)}</td>
      <td><span class="tag t-gray">${esc(p.method)}</span></td>
      <td class="mono">${fmtPKR(p.amount)}</td>
      <td>${statusTag(p.status)}</td>
      <td class="muted">${fmtDate(p.createdAt)}</td></tr>`);
  }

  // Auto-login if key stored.
  if (KEY) { fetch(API+'/admin/overview',{headers:{'x-admin-key':KEY}}).then(r=>{ if(r.ok) showApp(); }); }
</script>
</body>
</html>
